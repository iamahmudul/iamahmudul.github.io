<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#eef1f4;
    --surface:#ffffff;
    --ink:#17222c;
    --muted:#61717f;
    --rule:#d3dbe1;
    --rule-soft:#e6ebee;
    --green:#14663f;
    --green-soft:#e2efe8;
    --blue:#17527d;
    --amber:#8a5a12;
    --sans: ui-sans-serif, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1000px;margin:0 auto;padding:0 16px 96px}

  /* ---------- masthead ---------- */
  header{padding:34px 0 18px;border-bottom:1px solid var(--rule)}
  h1{font-size:26px;font-weight:650;letter-spacing:-0.02em;margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0}
  .meter{margin-top:20px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .meter-num{font-family:var(--mono);font-size:34px;font-weight:600;color:var(--green);letter-spacing:-0.03em;line-height:1}
  .meter-lab{color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--rule-soft);border-radius:3px;overflow:hidden;margin-top:12px}
  .bar > i{display:block;height:100%;background:var(--green);width:0;transition:width .35s ease}

  /* ---------- tabs ---------- */
  nav{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);
      display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-top:4px}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;
      padding:12px 14px;font:inherit;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
  nav button:hover{color:var(--ink)}
  nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blue);font-weight:600}
  nav button .cnt{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:6px}

  /* ---------- filter ---------- */
  .filters{display:flex;gap:6px;flex-wrap:wrap;padding:16px 0 4px}
  .chip{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:5px 11px;
        font:inherit;font-size:12.5px;color:var(--muted);cursor:pointer}
  .chip[data-on="1"]{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* ---------- day / group cards ---------- */
  .weekhead{display:flex;align-items:baseline;gap:12px;margin:30px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
  .weekhead h2{font-size:15px;font-weight:650;margin:0;letter-spacing:.01em}
  .weekhead span{color:var(--muted);font-size:13px}

  .day{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--rule);
       border-radius:4px;margin-bottom:8px;overflow:hidden}
  .day.done{border-left-color:var(--green);background:var(--green-soft)}
  .day.rest{border-left-color:var(--amber)}
  .dayhead{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;user-select:none}
  .dnum{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted);
        border:1px solid var(--rule);border-radius:3px;padding:3px 6px;min-width:38px;text-align:center;background:var(--surface)}
  .day.done .dnum{color:var(--green);border-color:var(--green)}
  .dtitle{flex:1;font-weight:600;font-size:14.5px}
  .dcount{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .caret{color:var(--muted);font-size:11px;transition:transform .18s}
  .day[data-open="1"] .caret{transform:rotate(90deg)}
  .items{display:none;padding:0 14px 10px}
  .day[data-open="1"] .items{display:block}

  /* ---------- checkable line ---------- */
  .line{display:flex;gap:11px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--rule-soft);cursor:pointer}
  .line:first-child{border-top:0}
  .box{flex:0 0 auto;width:17px;height:17px;margin-top:2px;border:1.5px solid #a9b6c1;border-radius:3px;
       background:var(--surface);position:relative}
  .line[data-on="1"] .box{background:var(--green);border-color:var(--green)}
  .line[data-on="1"] .box::after{content:"";position:absolute;left:5px;top:1px;width:4px;height:9px;
       border:solid #fff;border-width:0 2px 2px 0;transform:rotate(43deg)}
  .txt{flex:1;font-size:14.5px}
  .line[data-on="1"] .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:#b4c0ca}
  .tag{flex:0 0 auto;font-size:10.5px;letter-spacing:.02em;color:var(--muted);border:1px solid var(--rule);
       border-radius:3px;padding:1px 6px;margin-top:2px;white-space:nowrap;background:var(--surface)}
  .tag.code{color:var(--blue);border-color:#bcd0e0}
  .tag.design{color:#5d3a86;border-color:#d3c8e3}
  .tag.core{color:#7a4a12;border-color:#e0d0ba}
  .tag.behav{color:#96442f;border-color:#e6cabe}
  .tag.job{color:var(--green);border-color:#bcd8c9}

  /* ---------- flat checklist sections ---------- */
  .note{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--blue);
        border-radius:4px;padding:14px 16px;margin:18px 0;font-size:14.5px}
  .note strong{display:block;margin-bottom:4px}
  .grp{background:var(--surface);border:1px solid var(--rule);border-radius:4px;margin-bottom:8px}
  .grphead{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none}
  .grphead h3{flex:1;font-size:14.5px;font-weight:650;margin:0}
  .grp .items{padding:0 14px 10px}
  .grp[data-open="1"] .items{display:block}
  .grp[data-open="1"] .caret{transform:rotate(90deg)}

  /* ---------- footer bar ---------- */
  .footer{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--rule);
          padding:9px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;z-index:30}
  .footer .status{color:var(--muted);font-family:var(--mono);font-size:12px}
  .footer button{background:none;border:1px solid var(--rule);border-radius:4px;padding:6px 11px;
                 font:inherit;font-size:12.5px;color:var(--muted);cursor:pointer}
  .footer button:hover{color:#8c2f1d;border-color:#d9b5ad}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  @media (max-width:600px){
    h1{font-size:21px}
    .meter-num{font-size:28px}
    .txt{font-size:14px}
    .tag{display:none}
  }
</style>

/* ============================== STATE ============================== */

const KEY = "prep-tracker-v1";
let state = {checked:{}, open:{}};
let saveTimer = null;
const $ = s => document.querySelector(s);

function itemIds(){
  const ids = [];
  DAYS.forEach(d => d.i.forEach((_,k) => ids.push("d"+d.d+"-"+k)));
  SECTIONS.filter(s=>s.kind==="list").forEach(s =>
    s.data.groups.forEach((g,gi) => g[1].forEach((_,k) => ids.push(s.id+"-"+gi+"-"+k))));
  return ids;
}
const ALL_IDS = itemIds();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const p = JSON.parse(raw); state.checked = p.checked||{}; state.open = p.open||{}; }
  }catch(e){}
}
function save(){
  clearTimeout(saveTimer);
  $("#save").textContent = "Saving…";
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(KEY, JSON.stringify(state)); $("#save").textContent = "Saved"; }
    catch(e){ $("#save").textContent = "Not saved"; }
  }, 400);
}

/* ============================== RENDER ============================== */

let active = "daily";

function esc(s){ return s; }

function lineHTML(id, track, text){
  const on = state.checked[id] ? "1" : "0";
  const tag = T[track] ? '<span class="tag '+track+'">'+T[track]+'</span>' : '';
  return '<div class="line" data-id="'+id+'" data-on="'+on+'" role="checkbox" tabindex="0" aria-checked="'+(on==="1")+'">'
       + '<span class="box"></span><span class="txt">'+text+'</span>'+tag+'</div>';
}

function renderDays(){
  let h = '<div class="filters" id="filters">'
        + '<button class="chip" data-f="all" data-on="1">Everything</button>'
        + '<button class="chip" data-f="code" data-on="0">Coding only</button>'
        + '<button class="chip" data-f="design" data-on="0">Design only</button>'
        + '<button class="chip" data-f="core" data-on="0">Core topics only</button>'
        + '<button class="chip" data-f="behav" data-on="0">Behavioural only</button>'
        + '<button class="chip" data-f="job" data-on="0">Job search only</button>'
        + '<button class="chip" data-f="todo" data-on="0">Unfinished only</button></div>';
  let week = 0;
  DAYS.forEach(day => {
    if(day.w !== week){
      week = day.w;
      const wd = DAYS.filter(x=>x.w===week);
      const tot = wd.reduce((a,x)=>a+x.i.length,0);
      const dn = wd.reduce((a,x)=>a+x.i.filter((_,k)=>state.checked["d"+x.d+"-"+k]).length,0);
      h += '<div class="weekhead"><h2>Week '+week+'</h2><span>'+weekName(week)+'</span>'
         + '<span style="margin-left:auto;font-family:var(--mono);font-size:12px">'+dn+'/'+tot+'</span></div>';
    }
    const done = day.i.every((_,k)=>state.checked["d"+day.d+"-"+k]);
    const n = day.i.filter((_,k)=>state.checked["d"+day.d+"-"+k]).length;
    const open = state.open["d"+day.d] ? "1" : "0";
    h += '<div class="day'+(done?" done":"")+(day.r?" rest":"")+'" data-day="'+day.d+'" data-open="'+open+'">'
       + '<div class="dayhead" data-toggle="d'+day.d+'"><span class="dnum">D'+day.d+'</span>'
       + '<span class="dtitle">'+day.t+'</span><span class="dcount">'+n+'/'+day.i.length+'</span>'
       + '<span class="caret">&#9656;</span></div><div class="items">'
       + day.i.map((it,k)=>lineHTML("d"+day.d+"-"+k, it[0], it[1])).join('')
       + '</div></div>';
  });
  return h;
}
function weekName(w){
  return ["Launch and Java concurrency","Modern Java and the JVM","Spring and databases",
          "Distributed systems, Kafka, caching","Design depth and machine coding",
          "Security, resilience, testing","Cloud, APIs and AI engineering",
          "Consolidation and going loud"][w-1];
}

function renderList(sec){
  const d = sec.data;
  let h = '<div class="note"><strong>'+d.title+'</strong>'+d.intro+'</div>';
  d.groups.forEach((g,gi)=>{
    const ids = g[1].map((_,k)=>sec.id+"-"+gi+"-"+k);
    const n = ids.filter(i=>state.checked[i]).length;
    const open = state.open[sec.id+"-"+gi] ? "1" : "0";
    h += '<div class="grp" data-open="'+open+'"><div class="grphead" data-toggle="'+sec.id+'-'+gi+'">'
       + '<h3>'+g[0]+'</h3><span class="dcount">'+n+'/'+g[1].length+'</span><span class="caret">&#9656;</span></div>'
       + '<div class="items">'+g[1].map((t,k)=>lineHTML(sec.id+"-"+gi+"-"+k,"",t)).join('')+'</div></div>';
  });
  return h;
}

function renderTabs(){
  $("#tabs").innerHTML = SECTIONS.map(s=>{
    const ids = ALL_IDS.filter(i => s.kind==="days" ? i[0]==="d" && /^d\d+-/.test(i) : i.startsWith(s.id+"-"));
    const n = ids.filter(i=>state.checked[i]).length;
    return '<button data-tab="'+s.id+'" aria-selected="'+(active===s.id)+'">'+s.label
         + '<span class="cnt">'+n+'/'+ids.length+'</span></button>';
  }).join('');
}

function renderPanel(){
  const sec = SECTIONS.find(s=>s.id===active);
  $("#panel").innerHTML = sec.kind==="days" ? renderDays() : renderList(sec);
  applyFilter();
}

function renderMeter(){
  const n = ALL_IDS.filter(i=>state.checked[i]).length;
  const p = Math.round(n/ALL_IDS.length*100);
  $("#pct").textContent = p+"%";
  $("#pctlab").textContent = n+" of "+ALL_IDS.length+" items checked";
  $("#barfill").style.width = p+"%";
}

function renderAll(){ renderTabs(); renderPanel(); renderMeter(); }

/* ---------- filter ---------- */
let filter = "all";
function applyFilter(){
  if(active!=="daily") return;
  document.querySelectorAll("#panel .line").forEach(el=>{
    const tagEl = el.querySelector(".tag");
    const cls = tagEl ? tagEl.className.replace("tag","").trim() : "";
    let show = true;
    if(filter==="todo") show = el.dataset.on!=="1";
    else if(filter!=="all") show = cls===filter;
    el.style.display = show ? "" : "none";
  });
  document.querySelectorAll("#panel .day").forEach(d=>{
    const any = [...d.querySelectorAll(".line")].some(l=>l.style.display!=="none");
    d.style.display = any ? "" : "none";
    if(filter!=="all" && any) d.dataset.open = "1";
  });
}

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const tab = e.target.closest("[data-tab]");
  if(tab){ active = tab.dataset.tab; filter="all"; renderAll(); window.scrollTo(0,0); return; }

  const chip = e.target.closest(".chip");
  if(chip){
    filter = chip.dataset.f;
    document.querySelectorAll(".chip").forEach(c=>c.dataset.on = c===chip ? "1":"0");
    applyFilter(); return;
  }

  const tog = e.target.closest("[data-toggle]");
  if(tog){
    const k = tog.dataset.toggle;
    state.open[k] = !state.open[k];
    tog.parentElement.dataset.open = state.open[k] ? "1":"0";
    save(); return;
  }

  const line = e.target.closest(".line");
  if(line){ toggleLine(line); }
});
document.addEventListener("keydown", e=>{
  if((e.key===" "||e.key==="Enter") && e.target.classList && e.target.classList.contains("line")){
    e.preventDefault(); toggleLine(e.target);
  }
});
function toggleLine(line){
  const id = line.dataset.id;
  state.checked[id] = !state.checked[id];
  if(!state.checked[id]) delete state.checked[id];
  save();
  const sec = active;
  renderPanel(); renderTabs(); renderMeter();
}

$("#reset").addEventListener("click", ()=>{
  if(!confirm("Clear every checkbox? This cannot be undone.")) return;
  state = {checked:{}, open:{}};
  try{ localStorage.removeItem(KEY); }catch(e){}
  renderAll();
});

/* ---------- boot ---------- */
(async ()=>{
  await load();
  // open the first unfinished day by default
  if(Object.keys(state.open).length===0){
    const nxt = DAYS.find(d => d.i.some((_,k)=>!state.checked["d"+d.d+"-"+k]));
    if(nxt) state.open["d"+nxt.d] = true;
  }
  renderAll();
  $("#save").textContent = "Ready";
})();
</script>
